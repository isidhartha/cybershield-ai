version: "3.9"

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - REPORT_OUTPUT_DIR=/app/reports
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Ollama — optional free local LLM (uncomment to run Ollama in Docker)
  # Set LLM_PROVIDER=ollama and OLLAMA_BASE_URL=http://ollama:11434 in .env
  # ---------------------------------------------------------------------------
  # ollama:
  #   image: ollama/ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  # ollama_data:
